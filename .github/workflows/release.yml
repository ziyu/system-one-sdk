name: Release

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish or resume, such as adapter-llm-v0.5.2'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases, including manual retries. Never cancel an active publication.
concurrency:
  group: npm-and-github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ziyu/sytem-one-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate version, tag, and source branch
        run: node scripts/release.mjs validate
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build and test the exact package to publish
        run: npm run test:package
      - name: Publish to npm using OIDC and verify package integrity
        run: node scripts/release.mjs publish
      - name: Create GitHub Release and upload the verified package
        run: node scripts/release.mjs github
        env:
          GH_TOKEN: ${{ github.token }}
